<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="modern-normalize.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>Vera's portfolio</title>
  </head>
  <body>
     <header class="header">
      <div class="container">
        <div class="menu">
          <div class="logo menu__logo"><img src="icons/logo.svg" alt="logo"></div>
          <nav class="nav menu__nav">
            <a href="#" class="nav__item">About me</a>
            <a href="#" class="nav__item">Portfolio</a>
            <a href="#" class="nav__item">Price</a>
            <a href="#" class="nav__item">Faq</a>
            <a href="#" class="nav__item">Contacts</a>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero__sidebar sidebar">
          <div class="sidebar__year">2025</div>
          <div class="sidebar__award">Best Photographer by MAX</div>
        </div>
        <div class="hero__wrapper">
          <div class="hero__content">
            <div class="hero__stats">
              <div class="hero__stat">
                <span class="hero__stat-number">487</span>
                <span class="hero__stat-label">Photo sessions</span>
              </div>
              <div class="hero__stat">
                <span class="hero__stat-number">356</span>
                <span class="hero__stat-label">Satisfied clients</span>
              </div>
            </div>
            <h1 class="hero__title">Professional photographer</h1>
            <p class="hero__subtitle">Capture the Moment. Tell Your Story.</p>
          </div>
          <div class="hero__media">
            <img src="image/webp/img-10.webp" alt="model photo" width="220" height="220">
          </div>
          <div class="hero__aside">
            <img src="image/webp/img-11.webp" alt="model photo" width="280" height="374">
            <div class="hero__about-text">Hi! I’m Vera, a photographer. For me, photography is more than just an image.</div>
          </div>
          <a href="#" class="scroll-down">Scroll down</a>
        </div>
      </section>
    </main>
  </body>
</html>
